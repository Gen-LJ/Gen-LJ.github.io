<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lost in the Twisting Nether · Kaung L Joy</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Marcellus&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .nether {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 48px 16px;
      overflow: hidden;
      text-align: center;
      background:
        radial-gradient(ellipse 60% 50% at 50% 45%, rgba(163, 53, 238, .28), transparent 70%),
        radial-gradient(ellipse 90% 60% at 50% 120%, rgba(63, 169, 255, .18), transparent 70%),
        linear-gradient(180deg, #05030d, #120a24 60%, #07080d);
    }
    .nether__vortex {
      position: absolute;
      left: 50%;
      top: 45%;
      z-index: -1;
      width: min(120vw, 900px);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(from 0deg, rgba(163, 53, 238, .16) 0 10deg, transparent 10deg 24deg);
      -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%);
      mask: radial-gradient(circle, #000 20%, transparent 68%);
      animation: spin 40s linear infinite;
    }
    .nether__code {
      font: 600 .8rem/1 var(--f-display);
      letter-spacing: .4em;
      text-indent: .4em;
      text-transform: uppercase;
      color: #d9b8ff;
    }
    .nether__title {
      margin: .4em 0 .3em;
      font: 700 clamp(2.2rem, 7vw, 4.2rem)/1.05 var(--f-display);
      background: var(--name-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 0 #1a0f00) drop-shadow(0 8px 16px rgba(0, 0, 0, .7));
    }
    .nether__text { max-width: 560px; margin: 0 auto 30px; font-size: 1.12rem; color: var(--text-dim); }
    .nether__hint { margin-top: 20px; font: .9rem/1.4 var(--f-ui); color: var(--yellow); }
  </style>
</head>
<body>
  <main class="nether">
    <div class="nether__vortex" aria-hidden="true"></div>
    <div>
      <p class="nether__code">Error 404</p>
      <h1 class="nether__title">Lost in the Twisting Nether</h1>
      <p class="nether__text">The page you seek has drifted into the void. Use your Hearthstone to return to Yangon.</p>
      <a class="btn btn--red btn--lg" href="/">Use Hearthstone</a>
      <p class="nether__hint">Cooldown: none. Ravens also know the way.</p>
    </div>
  </main>
</body>
</html>
